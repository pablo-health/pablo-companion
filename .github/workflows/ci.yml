name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      swift: ${{ github.event_name == 'push' || steps.filter.outputs.swift }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          # Covers the app AND the root SPM package. Scoping this to 'mac/**'
          # alone meant a PR touching only Sources/ or Tests/ skipped both Swift
          # jobs and still reported the gate green in four seconds — the root
          # package is where CompanionSessionCore and its coverage gate live, so
          # that is exactly the code the gate exists to protect.
          filters: |
            swift:
              - 'mac/**'
              - 'Sources/**'
              - 'Tests/**'
              - 'Package.swift'
              - 'Package.resolved'
              - 'scripts/coverage-gate.sh'
              - '.github/workflows/ci.yml'

  swift-lint:
    name: Swift Lint
    needs: changes
    if: needs.changes.outputs.swift == 'true'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install SwiftLint
        run: |
          SWIFTLINT_VERSION=0.63.2
          curl -sL "https://github.com/realm/SwiftLint/releases/download/${SWIFTLINT_VERSION}/portable_swiftlint.zip" -o swiftlint.zip
          unzip -q swiftlint.zip -d swiftlint
          echo "$PWD/swiftlint" >> "$GITHUB_PATH"

      - name: Install SwiftFormat
        run: |
          SWIFTFORMAT_VERSION=0.59.1
          curl -sL "https://github.com/nicklockwood/SwiftFormat/releases/download/${SWIFTFORMAT_VERSION}/swiftformat.zip" -o swiftformat.zip
          unzip -q swiftformat.zip
          chmod +x swiftformat
          echo "$PWD" >> "$GITHUB_PATH"

      - name: SwiftLint
        run: swiftlint lint --strict --config mac/.swiftlint.yml mac/PabloCompanion/

      - name: SwiftFormat
        run: swiftformat --lint --config mac/.swiftformat mac/PabloCompanion/

  swift-test:
    name: Swift Build & Test
    needs: [changes, swift-lint]
    if: needs.changes.outputs.swift == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache SPM dependencies
        id: spm-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: mac/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('mac/PabloCompanion.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      - name: Build & Test
        run: |
          # xcodebuild is piped into xcpretty, and a pipeline exits with the
          # last command's status — without pipefail, xcpretty's 0 hides an
          # xcodebuild failure and this job reports green on a broken build.
          set -o pipefail
          DISABLE_PKGS=${{ steps.spm-cache.outputs.cache-hit == 'true' && '-disableAutomaticPackageResolution' || '' }}
          xcodebuild -project mac/PabloCompanion.xcodeproj \
            -scheme Pablo \
            -destination 'platform=macOS' \
            -clonedSourcePackagesDirPath mac/SourcePackages \
            $DISABLE_PKGS \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            test | xcpretty

      - name: Coverage gate (CompanionSessionCore)
        # A coverage number nobody enforces rots — the same way a green CI badge
        # sat over a build that did not compile until pipefail was added. This
        # ratchets: raise MIN_COVERAGE when real coverage rises, never lower it
        # to make a red build green.
        #
        # Scoped to CompanionSessionCore because it is the shared session wire
        # path both the app and the headless harness run, and the only part of
        # the mac codebase `swift test` can exercise without launching the app.
        env:
          MIN_COVERAGE: "85"
        run: ./scripts/coverage-gate.sh

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0

  gate:
    name: CI
    needs: [changes, swift-lint, swift-test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify CI result
        run: |
          changed="${{ needs.changes.outputs.swift }}"
          lint="${{ needs.swift-lint.result }}"
          test="${{ needs.swift-test.result }}"
          echo "swift changed: $changed"
          echo "swift-lint result: $lint"
          echo "swift-test result: $test"
          if [ "$changed" = "true" ]; then
            if [ "$lint" != "success" ]; then
              echo "::error::swift code changed and swift-lint did not succeed ($lint)"
              exit 1
            fi
            if [ "$test" != "success" ]; then
              echo "::error::swift code changed and swift-test did not succeed ($test)"
              exit 1
            fi
          fi
          echo "Gate passed"
