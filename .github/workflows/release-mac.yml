name: Release macOS

on:
  push:
    tags: ['v*']
  # Build + sign + verify without publishing, so the signing path can be
  # exercised without burning a version tag. Publishing steps are gated on
  # `github.event_name == 'push'`, so a dispatch run never releases.
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: release-mac
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Set version from tag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION=${GITHUB_REF_NAME#v}
          else
            # Dispatch runs never publish, so the version only has to be valid.
            VERSION=0.0.${{ github.run_number }}
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "DMG_NAME=Pablo-${VERSION}.dmg" >> $GITHUB_ENV
          BUILD=${{ github.run_number }}
          sed -i '' "s/MARKETING_VERSION = .*/MARKETING_VERSION = ${VERSION};/" \
            mac/PabloCompanion.xcodeproj/project.pbxproj
          sed -i '' "s/CURRENT_PROJECT_VERSION = .*/CURRENT_PROJECT_VERSION = ${BUILD};/" \
            mac/PabloCompanion.xcodeproj/project.pbxproj

      - name: Import signing certificate
        env:
          CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/signing.keychain-db
          security create-keychain -p "" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "" $KEYCHAIN_PATH
          echo $CERTIFICATE | base64 --decode > $RUNNER_TEMP/cert.p12
          security import $RUNNER_TEMP/cert.p12 -k $KEYCHAIN_PATH \
            -P "$PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "" $KEYCHAIN_PATH
          security list-keychains -d user -s $KEYCHAIN_PATH

      # The same App Store Connect key authenticates two things: fetching the
      # Developer ID provisioning profile during archive/export (which is what
      # authorizes the restricted associated-domains entitlement), and
      # notarization at the end.
      - name: Stage App Store Connect API key
        env:
          ASC_KEY: ${{ secrets.APPLE_NOTARY_KEY }}
        run: |
          echo "$ASC_KEY" | base64 --decode > $RUNNER_TEMP/asc.p8

      - name: Cache SPM
        uses: actions/cache@v6
        with:
          path: mac/SourcePackages
          key: spm-${{ hashFiles('mac/PabloCompanion.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      # Signing happens HERE, via Xcode, and must not be disabled. The target
      # already sets CODE_SIGN_ENTITLEMENTS, ENABLE_HARDENED_RUNTIME and
      # DEVELOPMENT_TEAM (mac/PabloCompanion.xcodeproj), so letting Xcode sign
      # is what attaches the entitlements and the provisioning profile.
      #
      # Do NOT reintroduce CODE_SIGNING_REQUIRED=NO / CODE_SIGNING_ALLOWED=NO.
      # Those skip entitlement embedding entirely, and a later hand-rolled
      # `codesign --sign` without `--entitlements` produces an app that is
      # correctly Developer ID signed, notarizes, staples, verifies clean — and
      # silently has no com.apple.developer.associated-domains, so every
      # universal link falls through to the browser. That shipped undetected;
      # the "Verify signing" step below is the regression guard.
      - name: Archive
        run: |
          xcodebuild archive \
            -project mac/PabloCompanion.xcodeproj \
            -scheme Pablo \
            -archivePath $RUNNER_TEMP/Pablo.xcarchive \
            -destination 'generic/platform=macOS' \
            -clonedSourcePackagesDirPath mac/SourcePackages \
            -allowProvisioningUpdates \
            -authenticationKeyPath $RUNNER_TEMP/asc.p8 \
            -authenticationKeyID ${{ secrets.APPLE_NOTARY_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.APPLE_NOTARY_ISSUER_ID }}

      - name: Export
        run: |
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/Pablo.xcarchive \
            -exportOptionsPlist mac/ExportOptions.plist \
            -exportPath $RUNNER_TEMP/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath $RUNNER_TEMP/asc.p8 \
            -authenticationKeyID ${{ secrets.APPLE_NOTARY_KEY_ID }} \
            -authenticationKeyIssuerID ${{ secrets.APPLE_NOTARY_ISSUER_ID }}

      # Fail the release rather than ship an app whose universal links are dead.
      # Each check below corresponds to a way the signed bundle can look healthy
      # while being functionally broken.
      - name: Verify signing
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/export/Pablo.app"

          codesign --verify --deep --strict --verbose=2 "$APP"

          # -dvvv, not -dv: the Authority= lines are only emitted at -vvv.
          DETAIL=$(codesign -dvvv "$APP" 2>&1)
          echo "$DETAIL"

          echo "$DETAIL" | grep -q "Authority=Developer ID Application" \
            || { echo "::error::not signed with a Developer ID Application identity"; exit 1; }

          # An association is keyed on the appID, which is <teamID>.<bundleID> —
          # both halves must match the appIDs served in the AASA, or the
          # association silently fails to form even though signing looks fine.
          # These two constants and the AASA must be changed together.
          EXPECTED_TEAM=L8KG4FA2R9
          EXPECTED_BUNDLE=health.pablo.companion

          echo "$DETAIL" | grep -q "^TeamIdentifier=${EXPECTED_TEAM}$" \
            || { echo "::error::signed by the wrong team — expected TeamIdentifier=${EXPECTED_TEAM}"; exit 1; }

          # ^Identifier= anchored so it can't match the TeamIdentifier= line.
          echo "$DETAIL" | grep -q "^Identifier=${EXPECTED_BUNDLE}$" \
            || { echo "::error::wrong bundle identifier — expected ${EXPECTED_BUNDLE}"; exit 1; }

          # Hardened runtime is required for notarization.
          echo "$DETAIL" | grep -qE "flags=.*runtime" \
            || { echo "::error::hardened runtime is not enabled"; exit 1; }

          # Distinguish "extraction failed" from "extracted, and it is empty".
          # An empty read is the defect this gate exists to catch; a codesign
          # error is a different problem entirely, and reporting one as the
          # other is how the original bug stayed hidden for so long.
          if ! ENTS=$(codesign -d --entitlements :- "$APP" 2>"$RUNNER_TEMP/ents.err"); then
            echo "::error::could not read entitlements from the bundle (codesign failed):"
            cat "$RUNNER_TEMP/ents.err"
            exit 1
          fi
          if [ -z "$ENTS" ]; then
            echo "::error::app carries NO entitlements — universal links cannot work"
            exit 1
          fi

          # The associated domains must match the AASA files served at
          # https://<domain>/.well-known/apple-app-site-association.
          for DOMAIN in app.pablo.health dev.pablo.health; do
            echo "$ENTS" | grep -q "applinks:${DOMAIN}" \
              || { echo "::error::missing entitlement applinks:${DOMAIN}"; exit 1; }
          done

          # On macOS, associated-domains is a restricted entitlement: outside the
          # App Store it is only honored when authorized by an embedded profile.
          test -f "$APP/Contents/embedded.provisionprofile" \
            || { echo "::error::no embedded.provisionprofile — the restricted associated-domains entitlement will be ignored"; exit 1; }

          # get-task-allow is a debug-only entitlement; notarization rejects it.
          # Written as an `if` on purpose: `grep -q X && exit 1` would abort the
          # step under `set -e` on the no-match (healthy) path.
          if echo "$ENTS" | grep -q "com.apple.security.get-task-allow"; then
            echo "::error::get-task-allow present — this is a debug-signed build"
            exit 1
          fi

          echo "Signing verified: Developer ID + hardened runtime + associated domains."

      - name: Create DMG
        run: |
          mkdir -p $RUNNER_TEMP/dmg-contents
          cp -R $RUNNER_TEMP/export/Pablo.app $RUNNER_TEMP/dmg-contents/
          ln -s /Applications $RUNNER_TEMP/dmg-contents/Applications
          hdiutil create -volname "Pablo" \
            -srcfolder $RUNNER_TEMP/dmg-contents \
            -ov -format UDZO \
            $RUNNER_TEMP/$DMG_NAME

      - name: Notarize
        if: github.event_name == 'push'
        run: |
          xcrun notarytool submit $RUNNER_TEMP/$DMG_NAME \
            --key $RUNNER_TEMP/asc.p8 \
            --key-id ${{ secrets.APPLE_NOTARY_KEY_ID }} \
            --issuer ${{ secrets.APPLE_NOTARY_ISSUER_ID }} \
            --wait --timeout 30m
          xcrun stapler staple $RUNNER_TEMP/$DMG_NAME

      - name: Generate appcast
        if: github.event_name == 'push'
        env:
          SPARKLE_KEY: ${{ secrets.SPARKLE_EDDSA_KEY }}
        run: |
          SPARKLE_TOOLS="mac/SourcePackages/artifacts/sparkle/Sparkle/bin"
          mkdir -p $RUNNER_TEMP/releases
          cp $RUNNER_TEMP/$DMG_NAME $RUNNER_TEMP/releases/
          echo "$SPARKLE_KEY" | $SPARKLE_TOOLS/generate_appcast \
            --ed-key-file /dev/stdin \
            --download-url-prefix "https://github.com/pablo-health/pablo-companion/releases/download/v${VERSION}/" \
            $RUNNER_TEMP/releases

      - name: Create GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ runner.temp }}/${{ env.DMG_NAME }}
          generate_release_notes: true

      - name: Publish appcast
        if: github.event_name == 'push'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ${{ runner.temp }}/releases
          keep_files: true
